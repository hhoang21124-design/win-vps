name: Debug Windows CI via Tailscale RDP
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  debug-runner:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and Connect Tailscale manually
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "1. Đang cài đặt Tailscale qua Chocolatey..."
          choco install tailscale -y --no-progress
          
          Write-Host "2. Đợi service khởi động..."
          Start-Sleep -Seconds 5
          
          Write-Host "3. Đăng nhập Tailscale ngầm (Unattended)..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTHKEY --unattended
        shell: powershell

      - name: Enable RDP and Create User
        run: |
          # Cho phép kết nối RDP trong Registry
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          
          # Xử lý tạo tài khoản hoặc cập nhật mật khẩu nếu đã tồn tại
          $User = "RunnerAdmin"
          $Password = ConvertTo-SecureString "TempPassword123!@" -AsPlainText -Force
          
          if (Get-LocalUser -Name $User -ErrorAction SilentlyContinue) {
              Write-Host "Tài khoản $User đã tồn tại. Đang cập nhật lại mật khẩu..."
              Set-LocalUser -Name $User -Password $Password
          } else {
              Write-Host "Đang tạo tài khoản $User mới..."
              New-LocalUser $User -Password $Password -FullName "Runner Admin" -Description "User for RDP Debugging"
              Add-LocalGroupMember -Group "Administrators" -Member $User
          }
        shell: powershell

      - name: Display Connection Info
        run: |
          # Lấy địa chỉ IPv4 của runner trong mạng Tailscale
          $TailscaleIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host "==========================================================="
          Write-Host "RDP Server is READY!"
          Write-Host "Mở Remote Desktop Connection trên máy bạn và kết nối tới:"
          Write-Host "IP Address: $TailscaleIP"
          Write-Host "Username:   RunnerAdmin"
          Write-Host "Password:   TempPassword123!@"
          Write-Host "==========================================================="
        shell: powershell

      - name: Keep Runner Alive
        run: |
          Write-Host "Đang giữ máy chủ hoạt động..."
          Start-Sleep -Seconds 21600
        shell: powershell
