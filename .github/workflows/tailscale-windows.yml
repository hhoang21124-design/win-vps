name: Debug Windows CI via Tailscale RDP
on: 
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  debug-runner:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System Environment Fix (Disable Test Mode)
        run: |
          Write-Host "Dang fix loi Test Mode va Integrity Checks..."
          # 1. Tat Test Mode trong BCD (Du khong reboot duoc nhung van can thiet de danh lua mot so app)
          bcdedit /set testsigning off
          bcdedit /set nointegritychecks off
          
          # 2. Chinh sua Registry de ghi de trang thai he thong
          # Cac lenh nay giup danh lua mot so engine kiem tra trang thai kernel
          reg add "HKLM\SYSTEM\CurrentControlSet\Control" /v "SystemStartOptions" /t REG_SZ /d " NOINTEGRITYCHECKS" /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy" /v "VerifiedAndReputablePolicyState" /t REG_DWORD /d 0 /f
          
          Write-Host "Fix hoan tat. Luu y: Mot so app yeu cau reboot se van co the bao loi."
        shell: powershell

      - name: Install and Connect Tailscale manually
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "1. Installing Tailscale..."
          choco install tailscale -y --no-progress
          
          Write-Host "2. Waiting for service..."
          Start-Sleep -Seconds 5
          
          Write-Host "3. Connecting to Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTHKEY --unattended --reset
        shell: powershell

      - name: Enable RDP and Create User
        run: |
          # Cho phep ket noi RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          
          # Tao tai khoan RunnerAdmin
          $User = 'RunnerAdmin'
          $Password = ConvertTo-SecureString 'TempPassword123!@' -AsPlainText -Force
          
          if (Get-LocalUser -Name $User -ErrorAction SilentlyContinue) {
              Write-Host "Tai khoan da ton tai. Dang cap nhat mat khau..."
              Set-LocalUser -Name $User -Password $Password
          } else {
              Write-Host "Dang tao tai khoan moi..."
              New-LocalUser -Name $User -Password $Password -FullName 'RunnerAdmin' -Description 'RDPUser'
              Add-LocalGroupMember -Group 'Administrators' -Member $User
          }
        shell: powershell

      - name: Display Connection Info
        run: |
          $TailscaleIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==========================================================="
          Write-Host "RDP Server is READY!"
          Write-Host "IP Address: $TailscaleIP"
          Write-Host "Username:   RunnerAdmin"
          Write-Host "Password:   TempPassword123!@"
          Write-Host "==========================================================="
        shell: powershell

      - name: Keep Runner Alive
        run: |
          Write-Host "Dang giu may chu hoat dong (6 tieng)..."
          # Lenh nay giup giu session khong bi ngat
          Start-Sleep -Seconds 21600
        shell: powershell
