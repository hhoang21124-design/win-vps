name: Debug Windows CI via Tailscale RDP
on: 
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  debug-runner:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix System Environment (Disable Test Mode)
        run: |
          Write-Host "--- Dang thuc hien Fix Kernel Integrity ---"
          # Tat Test Mode va Integrity Checks o cap do he thong
          bcdedit /set testsigning off
          bcdedit /set nointegritychecks off
          
          # Force ghi de vao Registry de "lua" cac ung dung kiem tra trang thai boot
          reg add "HKLM\SYSTEM\CurrentControlSet\Control" /v "SystemStartOptions" /t REG_SZ /d " NOINTEGRITYCHECKS" /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy" /v "VerifiedAndReputablePolicyState" /t REG_DWORD /d 0 /f
          
          # Reset lai trang thai Kernel Code Integrity qua Registry
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" /v "FeatureSettingsOverride" /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" /v "FeatureSettingsOverrideMask" /t REG_DWORD /d 3 /f
          
          Write-Host "Fix hoan tat. Dang tiep tuc setup..."
        shell: powershell

      - name: Install and Connect Tailscale manually
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "1. Installing Tailscale..."
          choco install tailscale -y --no-progress
          
          Write-Host "2. Waiting for service..."
          Start-Sleep -Seconds 5
          
          Write-Host "3. Connecting to Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTHKEY --unattended --reset
        shell: powershell

      - name: Enable RDP and Create User
        run: |
          # Cho phep ket noi RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          
          # Tao tai khoan RunnerAdmin
          $User = 'RunnerAdmin'
          $Password = ConvertTo-SecureString 'TempPassword123!@' -AsPlainText -Force
          
          if (Get-LocalUser -Name $User -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $User -Password $Password
          } else {
              New-LocalUser -Name $User -Password $Password -FullName 'RunnerAdmin' -Description 'RDPUser'
              Add-LocalGroupMember -Group 'Administrators' -Member $User
          }
        shell: powershell

      - name: Display Connection Info
        run: |
          $TailscaleIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==========================================================="
          Write-Host "VPS CUA BAN DA SAN SANG!"
          Write-Host "IP Tailscale: $TailscaleIP"
          Write-Host "User:         RunnerAdmin"
          Write-Host "Pass:         TempPassword123!@"
          Write-Host "==========================================================="
        shell: powershell

      - name: Keep Runner Alive
        run: |
          Write-Host "Dang giu VPS song trong 6 tieng..."
          Start-Sleep -Seconds 21600
        shell: powershell
