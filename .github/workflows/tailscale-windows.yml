name: Temporary Windows 2025 via Tailscale RDP

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "RDP session length in minutes (30-320)"
        required: true
        default: "240"

permissions:
  contents: read

concurrency:
  group: temporary-windows-rdp
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show runner image
        shell: powershell
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          Write-Host "Runner image: $env:ImageOS / $env:ImageVersion"

      - name: Validate session length
        id: session
        shell: powershell
        run: |
          $minutes = [int]"${{ inputs.session_minutes }}"
          if ($minutes -lt 30 -or $minutes -gt 320) { throw "session_minutes must be between 30 and 320." }
          "minutes=$minutes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Harden runner for long interactive session
        shell: powershell
        run: |
          # Prevent sleep/hibernate and reduce the chance of Windows Update restarting the VM.
          powercfg /hibernate off | Out-Null
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -Name NoAutoRebootWithLoggedOnUsers -PropertyType DWord -Value 1 -Force | Out-Null

          # Keep the Actions worker responsive if an interactive build temporarily consumes CPU.
          Get-Process -Name 'Runner.Listener','Runner.Worker' -ErrorAction SilentlyContinue | ForEach-Object {
            try { $_.PriorityClass = 'AboveNormal' } catch {}
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          choco install tailscale -y --no-progress
          $svc = Get-Service -Name Tailscale -ErrorAction SilentlyContinue
          if (-not $svc) { throw "Tailscale service was not installed." }
          if ($svc.Status -ne 'Running') { Start-Service Tailscale }
          Start-Sleep -Seconds 5

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) { throw "Missing repository secret: TAILSCALE_AUTHKEY" }
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { throw "Tailscale CLI not found." }

          & $ts up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="gh-win-$env:GITHUB_RUN_ID" --unattended --accept-dns=false --accept-routes=false
          if ($LASTEXITCODE -ne 0) { throw "tailscale up failed: $LASTEXITCODE" }

          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($ip)) { throw "Tailscale connected but no IPv4 address was assigned." }
          Write-Host "Tailscale IPv4: $ip"

      - name: Enable secure RDP
        id: rdp
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $tailscaleIp = (& $ts ip -4 | Select-Object -First 1).Trim()

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

          Disable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName "GitHub Actions Tailscale RDP" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "GitHub Actions Tailscale RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -LocalAddress $tailscaleIp -RemoteAddress 100.64.0.0/10 | Out-Null

          $user = "RunnerAdmin"
          $password = "GhA!" + [guid]::NewGuid().ToString("N").Substring(0,20)
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $user -Password $securePassword
          } else {
            New-LocalUser -Name $user -Password $securePassword -FullName "Runner Admin" -Description "Temporary RDP user"
          }

          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          "username=$user" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "password=$password" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Prepare OpenCode Desktop auto-start
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\ProgramData\OpenCodeBootstrap"
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          # Resolve the current official Windows x64 desktop release.
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/anomalyco/opencode/releases/latest" `
            -Headers @{ "User-Agent" = "github-actions-opencode-bootstrap" }

          $asset = $release.assets | Where-Object { $_.name -eq "opencode-desktop-win-x64.exe" } | Select-Object -First 1
          if (-not $asset) { throw "OpenCode Windows x64 desktop asset was not found in the latest release." }

          $installer = Join-Path $root "opencode-desktop-win-x64.exe"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer -UseBasicParsing

          # Verify the SHA-256 published with the GitHub release when available.
          if ($asset.digest -and $asset.digest.StartsWith("sha256:")) {
            $expected = $asset.digest.Substring(7).ToLowerInvariant()
            $actual = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "OpenCode installer SHA-256 mismatch." }
          }

          $bootstrap = @'
          $ErrorActionPreference = "Stop"
          Start-Sleep -Seconds 8

          $installer = "C:\ProgramData\OpenCodeBootstrap\opencode-desktop-win-x64.exe"
          $log = "C:\ProgramData\OpenCodeBootstrap\bootstrap.log"

          function Find-OpenCodeExe {
            $candidates = @(
              (Join-Path $env:LOCALAPPDATA "Programs\OpenCode\OpenCode.exe"),
              (Join-Path $env:LOCALAPPDATA "Programs\opencode\OpenCode.exe"),
              (Join-Path $env:LOCALAPPDATA "Programs\opencode-desktop\OpenCode.exe")
            )

            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) { return $candidate }
            }

            $programs = Join-Path $env:LOCALAPPDATA "Programs"
            if (Test-Path $programs) {
              $found = Get-ChildItem -Path $programs -Filter "OpenCode.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { return $found.FullName }
            }

            return $null
          }

          try {
            $exe = Find-OpenCodeExe

            if (-not $exe) {
              if (-not (Test-Path $installer)) { throw "OpenCode installer is missing." }
              Add-Content -Path $log -Value "$(Get-Date -Format o) Installing OpenCode Desktop..."
              $proc = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
              if ($proc.ExitCode -ne 0) { throw "OpenCode installer exited with code $($proc.ExitCode)." }

              Start-Sleep -Seconds 4
              $exe = Find-OpenCodeExe
            }

            if (-not $exe) { throw "OpenCode.exe was not found after installation." }

            if (-not (Get-Process -Name "OpenCode" -ErrorAction SilentlyContinue)) {
              Add-Content -Path $log -Value "$(Get-Date -Format o) Starting $exe"
              Start-Process -FilePath $exe -WorkingDirectory $env:USERPROFILE
            }
          }
          catch {
            Add-Content -Path $log -Value "$(Get-Date -Format o) ERROR: $($_.Exception.Message)"
          }
          '@

          $bootstrapPath = Join-Path $root "Start-OpenCode.ps1"
          Set-Content -Path $bootstrapPath -Value $bootstrap -Encoding UTF8

          # Run hidden at RunnerAdmin logon: GUI opens, PowerShell console stays hidden.
          $account = "$env:COMPUTERNAME\RunnerAdmin"
          $action = New-ScheduledTaskAction `
            -Execute "powershell.exe" `
            -Argument "-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$bootstrapPath`""

          $trigger = New-ScheduledTaskTrigger -AtLogOn -User $account
          $principal = New-ScheduledTaskPrincipal -UserId $account -LogonType Interactive -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 10)

          Register-ScheduledTask `
            -TaskName "OpenCode Desktop AutoStart" `
            -Action $action `
            -Trigger $trigger `
            -Principal $principal `
            -Settings $settings `
            -Description "Silently install and launch OpenCode Desktop when RunnerAdmin signs in." `
            -Force | Out-Null

          Write-Host "OpenCode Desktop latest release cached."
          Write-Host "It will silently install and open automatically when RunnerAdmin logs in."
          Write-Host "No PowerShell console window will be shown."
      - name: Connection info
        shell: powershell
        env:
          RDP_USER: ${{ steps.rdp.outputs.username }}
          RDP_PASSWORD: ${{ steps.rdp.outputs.password }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          Write-Host "============================================================"
          Write-Host "RDP address : $ip"
          Write-Host "Username    : $env:RDP_USER"
          Write-Host "Password    : $env:RDP_PASSWORD"
          Write-Host "============================================================"
          Write-Host "IMPORTANT: do not Restart/Shutdown Windows and do not disable network adapters."
          Write-Host "Starting another run will be queued instead of cancelling this VPS."
          Write-Host "OpenCode Desktop will install silently and open automatically after RDP login."

      - name: Keep session available and monitor runner
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $minutes = [int]"${{ steps.session.outputs.minutes }}"
          $deadline = (Get-Date).AddMinutes($minutes)
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $lastLog = (Get-Date).AddMinutes(-5)

          while ((Get-Date) -lt $deadline) {
            # Keep the Tailscale service alive without changing the machine's default route or DNS.
            $svc = Get-Service -Name Tailscale -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') {
              Write-Warning "Tailscale service stopped; restarting it."
              Start-Service Tailscale
              Start-Sleep -Seconds 3
            }

            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if ([string]::IsNullOrWhiteSpace($ip)) {
              Write-Warning "Tailscale lost its IP; reconnecting."
              & $ts up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="gh-win-$env:GITHUB_RUN_ID" --unattended --accept-dns=false --accept-routes=false
            }

            # Give the GitHub Actions agent slightly higher priority than interactive build tools.
            Get-Process -Name 'Runner.Listener','Runner.Worker' -ErrorAction SilentlyContinue | ForEach-Object {
              try { $_.PriorityClass = 'AboveNormal' } catch {}
            }

            if (((Get-Date) - $lastLog).TotalMinutes -ge 5) {
              $os = Get-CimInstance Win32_OperatingSystem
              $freeMB = [math]::Round($os.FreePhysicalMemory / 1024)
              $cpu = (Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average
              $remaining = [math]::Ceiling(($deadline - (Get-Date)).TotalMinutes)
              $github443 = Test-NetConnection github.com -Port 443 -InformationLevel Quiet -WarningAction SilentlyContinue
              Write-Host "Heartbeat: remaining=${remaining}m, freeRAM=${freeMB}MB, CPU=${cpu}%, GitHub443=$github443, TailscaleIP=$ip"
              $lastLog = Get-Date
            }

            Start-Sleep -Seconds 30
          }

      - name: Disconnect Tailscale
        if: always()
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (Test-Path $ts) { & $ts logout }
