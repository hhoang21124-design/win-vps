name: Windows VPS Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    # 🔓 Enable RDP
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    # 🔐 Set password
    - name: Set password
      run: |
        net user runneradmin P@ssw0rd@123

    # ⚡ Optimize system (FIX lỗi 1062)
    - name: Optimize System
      run: |
        if ((Get-Service DiagTrack).Status -eq "Running") {
          Stop-Service DiagTrack -Force
        }
        Set-Service DiagTrack -StartupType Disabled

        if ((Get-Service SysMain).Status -eq "Running") {
          Stop-Service SysMain -Force
        }
        Set-Service SysMain -StartupType Disabled

    # 🚀 Tắt Defender realtime (tăng tốc)
    - name: Disable Defender
      run: |
        Set-MpPreference -DisableRealtimeMonitoring $true

    # 📥 Download cloudflared
    - name: Download Cloudflared
      run: |
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe

    # 🌐 Start tunnel (KHÔNG TOKEN)
    - name: Start Tunnel
      run: |
        Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389"

    # ⏱️ Keep alive (giữ máy chạy tối đa)
    - name: Keep Alive
      run: |
        while ($true) {
          Write-Output "Running..."
          Start-Sleep -Seconds 300
        }
